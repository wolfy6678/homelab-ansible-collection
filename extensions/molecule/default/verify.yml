---
# Asserts the observable end state, not that tasks ran — a role that reports
# "changed" but leaves a dead unit or an uninitialised repo must fail here.
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    node_exporter_textfile_dir: /var/lib/node_exporter/textfile
  tasks:
    - name: Collect service state
      ansible.builtin.service_facts:

    - name: Collect the installed unit files
      # noqa: command-instead-of-module - querying, not managing: the systemd
      # module has no read-only mode and service_facts omits timers.
      ansible.builtin.command: systemctl list-unit-files --no-legend --no-pager
      register: unit_files
      changed_when: false

    # --- the shared service-install pattern -------------------------------
    - name: The node_exporter system user exists and cannot log in
      ansible.builtin.command: getent passwd node_exporter
      register: ne_user
      changed_when: false
      failed_when: "'/usr/sbin/nologin' not in ne_user.stdout"

    - name: The binary is installed under its version and symlinked into PATH
      ansible.builtin.stat:
        path: /usr/local/bin/node_exporter
      register: ne_link

    - name: The symlink points at the versioned install dir
      ansible.builtin.assert:
        that:
          - ne_link.stat.exists
          - ne_link.stat.islnk
          - "'/opt/node_exporter/v1.11.1/' in ne_link.stat.lnk_target"
        fail_msg: >-
          /usr/local/bin/node_exporter should be a symlink into
          /opt/node_exporter/<version>/ — that is what makes a version bump an
          upgrade. Got: {{ ne_link.stat.lnk_target | default('not a link') }}
        quiet: true

    - name: The textfile-collector directory exists and is writable by the exporter
      ansible.builtin.stat:
        path: "{{ node_exporter_textfile_dir }}"
      register: ne_textfile

    - name: Assert the textfile directory is a directory
      ansible.builtin.assert:
        that:
          - ne_textfile.stat.exists
          - ne_textfile.stat.isdir
        fail_msg: >-
          {{ node_exporter_textfile_dir }} is missing — the backup and
          proxmox_node roles write .prom files into it and would silently never
          be scraped.
        quiet: true

    - name: The node_exporter service is enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['node_exporter.service'].state == 'running'
          - ansible_facts.services['node_exporter.service'].status == 'enabled'
        fail_msg: "node_exporter.service is not enabled and running"
        quiet: true

    - name: The node_exporter endpoint actually serves metrics
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: ne_metrics
      retries: 5
      delay: 2
      until: ne_metrics.status is defined and ne_metrics.status == 200

    - name: The metrics output looks like node_exporter
      ansible.builtin.assert:
        that:
          - "'node_exporter_build_info' in ne_metrics.content"
          - "'node_textfile_scrape_error' in ne_metrics.content"
        fail_msg: >-
          /metrics responded but without the textfile collector — the unit is
          missing its --collector.textfile.directory flag.
        quiet: true

    # --- unattended_upgrades ----------------------------------------------
    - name: Both apt periodic config files are present
      ansible.builtin.stat:
        path: "{{ item }}"
      register: uu_files
      loop:
        - /etc/apt/apt.conf.d/20auto-upgrades
        - /etc/apt/apt.conf.d/50unattended-upgrades

    - name: Assert the apt config files exist
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "{{ item.item }} is missing"
        quiet: true
      loop: "{{ uu_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: The apt timers are enabled
      ansible.builtin.assert:
        that:
          - "'apt-daily.timer' in unit_files.stdout"
          - "'apt-daily-upgrade.timer' in unit_files.stdout"
        fail_msg: "the apt-daily timers were not installed"
        quiet: true

    # --- mosquitto ---------------------------------------------------------
    - name: The mosquitto service is enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['mosquitto.service'].state == 'running'
          - ansible_facts.services['mosquitto.service'].status == 'enabled'
        fail_msg: "mosquitto.service is not enabled and running"
        quiet: true

    - name: The broker password file is not world-readable
      ansible.builtin.stat:
        path: /etc/mosquitto/passwd
      register: mq_passwd

    # 0640 root:mosquitto, not 0600: the broker runs as the mosquitto user and
    # needs group read. What matters is that "other" has nothing.
    - name: Assert the password file is locked down
      ansible.builtin.assert:
        that:
          - mq_passwd.stat.exists
          - mq_passwd.stat.mode == '0640'
          - mq_passwd.stat.pw_name == 'root'
          - mq_passwd.stat.gr_name == 'mosquitto'
        fail_msg: >-
          /etc/mosquitto/passwd should be 0640 root:mosquitto, got
          {{ mq_passwd.stat.mode | default('missing') }}
          {{ mq_passwd.stat.pw_name | default('?') }}:{{ mq_passwd.stat.gr_name | default('?') }}
        quiet: true

    # --- backup ------------------------------------------------------------
    - name: The restic repository was really initialised
      ansible.builtin.stat:
        path: /srv/restic-test/config
      register: restic_repo

    - name: Assert the repository exists
      ansible.builtin.assert:
        that: restic_repo.stat.exists
        fail_msg: >-
          /srv/restic-test/config is missing — the role reported success without
          initialising the repository, so the first backup would fail.
        quiet: true

    - name: The restic environment file holds the password and is private
      ansible.builtin.stat:
        path: /etc/restic/homelab.env
      register: restic_env

    - name: Assert the environment file is locked down
      ansible.builtin.assert:
        that:
          - restic_env.stat.exists
          - restic_env.stat.mode == '0600'
        fail_msg: >-
          /etc/restic/homelab.env carries the repository password and must be
          0600, got
          {{ restic_env.stat.mode | default('missing') }}
        quiet: true

    # service_facts does not report timers, so ask systemd directly.
    - name: The backup timer is enabled and active
      # noqa: command-instead-of-module - see above; service_facts omits timers.
      ansible.builtin.command: "systemctl {{ item }} restic-backup.timer"
      register: restic_timer
      changed_when: false
      failed_when: restic_timer.stdout | trim not in ['enabled', 'active']
      loop: [is-enabled, is-active]

    - name: The backup wrapper script is executable
      ansible.builtin.stat:
        path: /usr/local/bin/restic-backup
      register: restic_script

    - name: Assert the wrapper script is in place
      ansible.builtin.assert:
        that:
          - restic_script.stat.exists
          - restic_script.stat.executable
        fail_msg: "/usr/local/bin/restic-backup is missing or not executable"
        quiet: true
