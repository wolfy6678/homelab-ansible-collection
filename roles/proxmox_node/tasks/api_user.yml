---
# Create-only provisioning of a dedicated Terraform identity. Each create step is
# gated on the resource not already existing, so re-runs are no-ops. The token
# secret is shown ONCE (PVE never reveals it again) — capture it from the play
# output and store it vault-encrypted.
- name: List existing PVE roles
  ansible.builtin.command: pveum role list --output-format json
  register: proxmox_node_roles
  changed_when: false

- name: Create the Terraform PVE role
  ansible.builtin.command:
    cmd: "pveum role add {{ proxmox_node_terraform_role }} --privs '{{ proxmox_node_terraform_privs }}'"
  when: proxmox_node_terraform_role not in (proxmox_node_roles.stdout | from_json | map(attribute='roleid') | list)
  changed_when: true

- name: List existing PVE users
  ansible.builtin.command: pveum user list --output-format json
  register: proxmox_node_users
  changed_when: false

- name: Create the Terraform PVE user
  ansible.builtin.command:
    cmd: "pveum user add {{ proxmox_node_terraform_user }}"
  when: proxmox_node_terraform_user not in (proxmox_node_users.stdout | from_json | map(attribute='userid') | list)
  changed_when: true

# Idempotent in effect — re-applying the same ACL changes nothing on the host.
- name: Grant the Terraform role to the user at the root path
  ansible.builtin.command:
    cmd: "pveum acl modify / --users {{ proxmox_node_terraform_user }} --roles {{ proxmox_node_terraform_role }}"
  changed_when: false

- name: List existing API tokens for the Terraform user
  ansible.builtin.command: "pveum user token list {{ proxmox_node_terraform_user }} --output-format json"
  register: proxmox_node_tokens
  changed_when: false

# privsep 0 → the token inherits the user's privileges (no separate token ACL).
- name: Create the Terraform API token
  ansible.builtin.command:
    cmd: "pveum user token add {{ proxmox_node_terraform_user }} {{ proxmox_node_terraform_token_id }} --privsep 0 --output-format json"
  register: proxmox_node_token_create
  when: proxmox_node_terraform_token_id not in (proxmox_node_tokens.stdout | from_json | map(attribute='tokenid') | list)
  changed_when: true

- name: Show the new API token secret (store it now — shown only once)  # noqa: no-handler
  ansible.builtin.debug:
    msg: >-
      Terraform API token created:
      {{ proxmox_node_terraform_user }}!{{ proxmox_node_terraform_token_id }} =
      {{ (proxmox_node_token_create.stdout | from_json).value }}
      — put it in group_vars/proxmox/terraform.yml (vault-encrypt the secret) and
      point terraform_proxmox_user + the token id/secret at it.
  when: proxmox_node_token_create is changed
