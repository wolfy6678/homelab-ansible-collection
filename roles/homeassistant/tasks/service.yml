---
# Deploy the systemd unit and bring the service up. Any pending
# "Restart homeassistant" handler is flushed by main.yml immediately after
# this file so the freshly installed components are loaded before the
# config-flow API is driven.

- name: Template systemd service unit
  ansible.builtin.template:
    src: homeassistant.service.j2
    dest: /etc/systemd/system/homeassistant.service
    mode: "0644"
  notify: Restart homeassistant

- name: Enable and start homeassistant service
  ansible.builtin.systemd_service:
    name: homeassistant
    state: started
    enabled: true
    daemon_reload: true
