---
# homeassistant 2026.6+ requires Python >= 3.14.2; Debian 13 (trixie) ships
# only 3.13, so the role adds the syssi python3.14-backport APT repo
# (community rebuild of the official Debian python3.14 packaging for trixie)
# and installs python3.14 from it.

- name: Install OS dependencies
  ansible.builtin.apt:
    name:
      - bluez
      - libffi-dev
      - libssl-dev
      - libjpeg-dev
      - zlib1g-dev
      - autoconf
      - build-essential
      - libopenjp2-7
      - libtiff6
      - libturbojpeg0-dev
      - tzdata
      - ffmpeg
      - liblapack3
      - liblapack-dev
      - libopenblas-dev
      - git
    state: present
    update_cache: true

- name: Download syssi python3.14-backport signing key
  ansible.builtin.get_url:
    url: https://syssi.github.io/python3.14-backport/syssi-python3.14-backport.gpg
    dest: /etc/apt/keyrings/syssi-python3.14-backport.gpg
    mode: "0644"

- name: Configure syssi python3.14-backport APT source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/python3.14-backport.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://syssi.github.io/python3.14-backport
      Suites: trixie-backports
      Components: main
      Signed-By: /etc/apt/keyrings/syssi-python3.14-backport.gpg

- name: Install python3.14 from backport repo
  ansible.builtin.apt:
    name:
      - python3.14
      - python3.14-venv
      - python3.14-dev
    state: present
    update_cache: true

- name: Create homeassistant system user
  ansible.builtin.user:
    name: "{{ homeassistant_user }}"
    system: true
    create_home: true

# Migration guard: if the existing venv was built on the old uv-managed
# standalone CPython (symlink target != /usr/bin/python3.14), remove it so
# it gets rebuilt against the backport interpreter on the next task.
- name: Check venv python interpreter
  ansible.builtin.stat:
    path: "{{ homeassistant_venv_dir }}/bin/python3"
  register: homeassistant_venv_python

- name: Remove venv built on a different interpreter
  ansible.builtin.file:
    path: "{{ homeassistant_venv_dir }}"
    state: absent
  when:
    - homeassistant_venv_python.stat.exists
    - homeassistant_venv_python.stat.islnk | default(false)
    - homeassistant_venv_python.stat.lnk_source != '/usr/bin/python3.14'
  notify: Restart homeassistant

# /srv is root-owned, so the unprivileged homeassistant user can't create the
# venv dir itself — pre-create it with the right ownership
- name: Create venv directory
  ansible.builtin.file:
    path: "{{ homeassistant_venv_dir }}"
    state: directory
    owner: "{{ homeassistant_user }}"
    group: "{{ homeassistant_user }}"
    mode: "0755"

# The backport bundles pip inside the python3.14 package, so
# `python3.14 -m venv` seeds a working pip into the venv.
- name: Install homeassistant into virtualenv
  ansible.builtin.pip:
    name: "homeassistant=={{ homeassistant_version }}"
    virtualenv: "{{ homeassistant_venv_dir }}"
    virtualenv_command: "/usr/bin/python3.14 -m venv"
  become: true
  become_user: "{{ homeassistant_user }}"
  notify: Restart homeassistant
