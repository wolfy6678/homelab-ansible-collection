---
# Local-MQTT Glow route (Hildebrand Glow IHD/CAD). Active only on the MQTT route
# (mosquitto_enabled) AND once the device is present (homeassistant_glow_mqtt_enabled).
# Templated ahead of the hardware — a no-op until both are true. The broker must be
# reachable when the MQTT config entry is created, so run the mosquitto
# play before this one; the broker account comes from group_vars/mosquitto.
- name: Configure the local-MQTT Glow route
  when:
    - mosquitto_enabled | default(false)
    - homeassistant_glow_mqtt_enabled
  block:
    - name: Template the Glow MQTT sensor package
      ansible.builtin.template:
        src: glow_mqtt.yaml.j2
        dest: "{{ homeassistant_config_dir }}/packages/glow_mqtt.yaml"
        owner: "{{ homeassistant_user }}"
        group: "{{ homeassistant_user }}"
        mode: "0600"
      register: homeassistant_glow_mqtt_package

    - name: Wait for the HA API and fetch any existing MQTT config entry
      ansible.builtin.uri:
        url: "http://localhost:{{ homeassistant_port }}/api/config/config_entries/entry?domain=mqtt"
        headers:
          Authorization: "Bearer {{ homeassistant_api_token }}"
        status_code: [200, 401, 502, 503]
      register: homeassistant_mqtt_entries
      retries: 30
      delay: 2
      # 401 is terminal (HA's API answers once auth is loaded, so it means a bad
      # token, not "still starting") — stop retrying and let the assert explain.
      until: homeassistant_mqtt_entries.status in [200, 401]
      no_log: true

    - name: Fail clearly if Home Assistant rejected the admin token
      ansible.builtin.assert:
        that: homeassistant_mqtt_entries.status == 200
        fail_msg: >-
          Home Assistant returned 401 for homeassistant_api_token — it is missing,
          invalid, or not an admin long-lived token. Create one under HA profile >
          Security and set homeassistant_api_token (vault-encrypted).
        quiet: true

    # The MQTT setup flow auto-advances to the broker step on non-hassio installs,
    # so starting the flow returns the broker form directly; submitting the broker
    # settings validates by actually connecting, then creates the entry.
    - name: Start the MQTT config flow
      ansible.builtin.uri:
        url: "http://localhost:{{ homeassistant_port }}/api/config/config_entries/flow"
        method: POST
        body_format: json
        body:
          handler: mqtt
        headers:
          Authorization: "Bearer {{ homeassistant_api_token }}"
      register: homeassistant_mqtt_flow
      when: homeassistant_mqtt_entries.json | length == 0
      no_log: true

    - name: Submit MQTT broker settings
      ansible.builtin.uri:
        url: "http://localhost:{{ homeassistant_port }}/api/config/config_entries/flow/{{ homeassistant_mqtt_flow.json.flow_id }}"
        method: POST
        body_format: json
        body:
          broker: "{{ homeassistant_mqtt_host }}"
          port: "{{ homeassistant_mqtt_port | int }}"
          username: "{{ mosquitto_username | default('homelab') }}"
          password: "{{ mosquitto_password }}"
        headers:
          Authorization: "Bearer {{ homeassistant_api_token }}"
      register: homeassistant_mqtt_submit
      when: homeassistant_mqtt_flow is not skipped
      no_log: true

    - name: Assert the MQTT broker was configured
      ansible.builtin.assert:
        that:
          - homeassistant_mqtt_submit.json.type == 'create_entry'
        fail_msg: >-
          MQTT broker setup failed
          ({{ homeassistant_mqtt_submit.json.errors | default('unexpected response') }}).
          Check the broker is up and mosquitto_username / mosquitto_password are correct.
        success_msg: MQTT broker configured.
      when: homeassistant_mqtt_flow is not skipped

    # Reload so the MQTT integration picks up the YAML sensor package — needed when
    # the package changed or the broker entry was just created.
    - name: Restart Home Assistant to load the Glow MQTT sensors
      ansible.builtin.systemd_service:
        name: homeassistant
        state: restarted
      when: homeassistant_glow_mqtt_package is changed or homeassistant_mqtt_flow is not skipped

    - name: Add the Glow MQTT sensors to the Energy dashboard
      ansible.builtin.script:
        cmd: manage_energy_dashboard.py
        executable: "{{ homeassistant_venv_dir }}/bin/python3"
      environment:
        HASS_URL: "http://localhost:{{ homeassistant_port }}"
        HASS_TOKEN: "{{ homeassistant_api_token }}"
        ACTION: add
        STAT_ELEC_FROM: sensor.glow_electricity_import
        ELEC_PRICE_ENTITY: sensor.glow_electricity_unit_rate
        STAT_GAS_FROM: "{{ 'sensor.glow_gas_import' if homeassistant_glow_mqtt_gas else '' }}"
        GAS_PRICE_ENTITY: "{{ 'sensor.glow_gas_unit_rate' if homeassistant_glow_mqtt_gas else '' }}"
      register: homeassistant_glow_mqtt_energy
      changed_when: "'CHANGED' in homeassistant_glow_mqtt_energy.stdout"
      until: homeassistant_glow_mqtt_energy.rc == 0
      retries: 30
      delay: 5
      no_log: true
      when: homeassistant_glow_mqtt_energy_dashboard | default(true)
