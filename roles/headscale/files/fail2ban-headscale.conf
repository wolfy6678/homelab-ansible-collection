# Managed by Ansible — do not edit on the host
# Fail2ban filter for headscale's public endpoint, matching the two shapes
# hostile traffic actually produces in the journal (verified against live
# scanner hits on the deployed LXC):
#   1. Go's stdlib http server logging junk/scanner TLS handshakes:
#        http: TLS handshake error from 152.32.131.104:47246: tls: first record does not look like a TLS handshake
#   2. headscale's zerolog request log for path probes (4xx):
#        ... INF http request ... method=GET path=/wp-login.php ... remote=45.33.12.9:41234 status=404
# NB the LAN must stay in the jail's ignoreip: the Gatus health check trips
# pattern 1 ("... EOF") once a minute from the homepage LXC.

[Definition]
failregex = ^.*http: TLS handshake error from \[?<ADDR>\]?:\d+: .+$
            ^.*\bhttp request\b.*\bremote=\[?<ADDR>\]?:\d+ status=4\d\d\b.*$
journalmatch = _SYSTEMD_UNIT=headscale.service
