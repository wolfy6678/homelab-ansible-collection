---
- name: Restart headscale
  ansible.builtin.systemd_service:
    name: headscale
    state: restarted
    daemon_reload: true

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Restart fail2ban exporter
  ansible.builtin.systemd_service:
    name: fail2ban-exporter
    state: restarted
    daemon_reload: true
