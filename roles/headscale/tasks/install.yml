---
- name: Install OS dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

# --- Tailscale (the subnet-router client) from the official apt repo --------
- name: Add Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
  register: headscale_tailscale_repo

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: "{{ headscale_tailscale_repo is changed }}"

- name: Ensure tailscaled is started and enabled
  ansible.builtin.systemd_service:
    name: tailscaled
    state: started
    enabled: true

# Subnet routing requires the kernel to forward packets between the tunnel and
# the LAN interface.
- name: Enable IP forwarding for subnet routing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  register: headscale_ip_forward_conf

- name: Apply sysctl settings  # noqa: no-handler
  ansible.builtin.command: sysctl --system
  when: headscale_ip_forward_conf is changed
  changed_when: true

# --- Headscale (the control server) from the published .deb -----------------
# The .deb ships the headscale system user, the /usr/bin/headscale binary, the
# data dir and a hardened systemd unit (which already grants CAP_NET_BIND_SERVICE
# so headscale can bind :443 directly). We template our own config over it.
- name: Download headscale .deb package
  ansible.builtin.get_url:
    url: "https://github.com/juanfont/headscale/releases/download/v{{ headscale_version }}/headscale_{{ headscale_version }}_linux_amd64.deb"
    dest: "/opt/headscale_{{ headscale_version }}_amd64.deb"
    mode: "0644"

- name: Install headscale
  ansible.builtin.apt:
    deb: "/opt/headscale_{{ headscale_version }}_amd64.deb"
