---
# Example inventory for the homelab.core collection.
#
# Naming: the container is created with `inventory_hostname_short`, so
# `monitoring.example.lan` becomes the container `monitoring`. That short name
# is also the Prometheus `instance` label, the Terraform map key and the
# backup_default_paths key — keep it short and stable.
#
# Addresses here are examples: LAN 192.168.50.0/24, gateway/firewall .1,
# Proxmox host .2, containers .100+.

# The Proxmox VE host. Addressed by NAME with no ansible_host, so the name must
# resolve on your LAN — the same name terraform_proxmox_api_url uses. Not under
# `lxc`: it is the hypervisor, not a container this collection creates.
proxmox:
  hosts:
    pve.example.lan:

# Everything under `lxc` is created by Terraform via the proxmox role. Each
# child group is a service; a host may appear in other groups too (co-location).
lxc:
  children:
    homepage:
      hosts:
        homepage.example.lan:
          ansible_host: 192.168.50.100
          lxc_overrides:
            cores: 1
            memory: 2048

    homeassistant:
      hosts:
        homeassistant.example.lan:
          ansible_host: 192.168.50.101
          lxc_overrides:
            rootfs_size: 32G

    jellyfin:
      hosts:
        jellyfin.example.lan:
          ansible_host: 192.168.50.103
          lxc_overrides:
            memory: 4096
            rootfs_size: 16G
            # To attach external storage (a USB drive or NAS), mount it on the
            # Proxmox host first (fstab or an NFS mount), then bind-mount it in:
            # mountpoints:
            #   - storage: /mnt/media   # host path
            #     volume: /mnt/media    # same host path for a bind mount
            #     mp: /mnt/media        # path inside the container
            #     size: 0G              # ignored for bind mounts

    otterwiki:
      hosts:
        otterwiki.example.lan:
          ansible_host: 192.168.50.104
          lxc_overrides:
            cores: 1
            memory: 1024

    headscale:
      hosts:
        headscale.example.lan:
          ansible_host: 192.168.50.106
          # Tailscale subnet routing needs /dev/net/tun inside the container.
          # The proxmox role adds the passthrough and reboots the container.
          lxc_tun: true
          lxc_overrides:
            cores: 1
            memory: 1024

    caddy:
      hosts:
        caddy.example.lan:
          ansible_host: 192.168.50.107
          lxc_overrides:
            cores: 1
            memory: 512

    monitoring:
      hosts:
        monitoring.example.lan:
          ansible_host: 192.168.50.108
          lxc_overrides:
            memory: 4096     # Prometheus + Grafana + Loki
            rootfs_size: 20G # Prometheus TSDB at 90d retention

# --- Groups that create no container ----------------------------------------

# Gatus, co-located on the homepage container.
gatus:
  hosts:
    homepage.example.lan:

# MQTT broker, co-located on the Home Assistant container. A no-op until
# mosquitto_enabled is set.
mosquitto:
  hosts:
    homeassistant.example.lan:

# The OPNsense firewall. NOT under `lxc` — it is an existing appliance, and the
# role talks to its API from localhost (see group_vars/opnsense). A no-op until
# opnsense_manage_enabled is set.
opnsense:
  hosts:
    opnsense.example.lan:
      ansible_host: 192.168.50.1

# Hosts whose application data restic backs up. What gets backed up comes from
# backup_default_paths in group_vars/backup. A no-op until backup_enabled.
backup:
  hosts:
    homeassistant.example.lan:
    otterwiki.example.lan:
    jellyfin.example.lan:
