---
# Project NOMAD — offline knowledge server. See roles/project_nomad/README.md.
#
# Needs keyctl on the LXC (set in the inventory) because NOMAD runs on Docker.

# Pinned admin image. Upgrade by bumping this, never by stepping it down — the
# admin's database migrations are forward-only.
project_nomad_version: 1.34.1

# Content (ZIMs, AI models, maps) is large. To keep it off the rootfs,
# bind-mount storage in with lxc_overrides.mountpoints and point this at it.
# project_nomad_storage_dir: /mnt/nomad

# Generate with: openssl rand -hex 32 (16+ characters)
# project_nomad_app_key: !vault |
#   ...

# MySQL takes these on first start only — changing them later breaks the
# admin's connection rather than rotating the password.
# project_nomad_db_password: !vault |
#   ...
# project_nomad_db_root_password: !vault |
#   ...

# Served through Caddy (the nomad, kiwix and cyberchef entries in
# group_vars/caddy). The admin builds absolute links from project_nomad_url,
# and project_nomad_app_urls repoints each app's "Open" button at its clean
# hostname instead of <this host>:<port>. Kolibri has no Caddy site here, so
# it keeps NOMAD's default port link.
project_nomad_url: "https://nomad.{{ hostvars[groups['caddy'][0]].caddy_base_domain }}"
project_nomad_app_urls:
  nomad_kiwix_server: "https://kiwix.{{ hostvars[groups['caddy'][0]].caddy_base_domain }}"
  nomad_cyberchef: "https://cyberchef.{{ hostvars[groups['caddy'][0]].caddy_base_domain }}"

# Dozzle (container logs, linked from Settings) has no authentication.
project_nomad_dozzle_enabled: true

# --- Configuration, applied through the admin's API ---------------------------
# Settings are reconciled every run; apps and content are only ever added,
# never removed. See roles/project_nomad/README.md for the catalogue of names.

project_nomad_settings:
  ui.hasVisitedEasySetup: true # skip the setup wizard — this file is the setup

# The AI Assistant is nomad_ollama; it is off unless you list it here.
project_nomad_apps:
  - nomad_kiwix_server # the Information Library — serves every ZIM below
  - nomad_kolibri
  - nomad_cyberchef

# none, top-mini, top-nopic, all-mini, all-nopic or all-maxi (~100 GB)
project_nomad_wikipedia: top-nopic

# category: tier. Tiers are cumulative: standard includes essential.
project_nomad_content_tiers:
  medicine: medicine-standard
  survival: survival-essential

# Upstream's offline map collections are US regions only.
# project_nomad_map_collections:
#   - pacific

# Map packs for anywhere else, cut from the global map by country or continent.
# Only ever added; a pack already on disk or still extracting is skipped.
project_nomad_map_regions:
  - countries: [GB, IE]
    label: British Isles
  # - group: europe      # a whole continent — lower the zoom, it is large
  #   maxzoom: 10

# Calibre-Web (when nomad_calibreweb is in project_nomad_apps) is pointed at
# the library NOMAD seeds in /books automatically. It also starts as
# admin / admin123; setting a password replaces that login once, while it is
# still the factory one, and UI changes afterwards stick.
# project_nomad_calibreweb_admin_user: admin
# project_nomad_calibreweb_admin_password: !vault |
#   ...
